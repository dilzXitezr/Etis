<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DILZ TOOLS - Sukabumi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a0a;color:#e8f0e8;font-family:monospace;padding:20px}
header{display:flex;justify-content:space-between;max-width:1100px;margin:0 auto 20px}
.hero{max-width:1100px;margin:0 auto 20px}
.hero h1{font-size:42px;line-height:.95;letter-spacing:-2px}
.hero h1 span{color:#d6ff00}
.grid{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#111616;border:1px solid #1e2a2a;border-radius:16px;padding:14px}
.card:hover{border-color:#d6ff00}
.down{background:#d6ff00;color:#000;padding:12px;border-radius:10px;text-align:center;font-weight:800;cursor:pointer;margin:10px auto;max-width:1100px}
input{width:100%;max-width:1100px;margin:0 auto 12px;display:block;background:#111616;border:1px solid #1e2a2a;border-radius:12px;padding:12px;color:#fff}
</style>
</head>
<body>
<header><div>DILZ_TOOLS_SUKABUMI</div><div style="font-size:10px;border:1px solid #1e2a2a;padding:4px 8px;border-radius:99px">BISA DI-DOWNLOAD GITHUB</div></header>
<div class="hero"><h1>Tools yang <span>bagus</span>, bukan yang banyak.</h1><p style="color:#6b7a6b;margin-top:10px">Web tools clean buat OSINT & Utility. 1 file. Bisa di-host & bisa di-download via Raw GitHub.</p></div>
<div class="down" onclick="downloadFile()">⬇ KLIK UNTUK DOWNLOAD FILE INI LANGSUNG</div>
<input id="q" placeholder="Cari tools... ip, qr, ig, cuaca" oninput="render()">
<div class="grid" id="grid"></div>
<script>
const tools=[
['IP-TRACK','📍','osint','Lacak lokasi IP & ISP'],
['NUM-LOOK','📱','osint','Cek operator nomor HP'],
['DOMAIN','🌐','network','WHOIS & DNS domain'],
['PORT-SCAN','🔌','network','Scan port terbuka'],
['QR-GEN','⬜','utility','Bikin QR code custom'],
['BASE64','🔐','utility','Encode decode Base64'],
['IG-DOWN','📸','utility','Download IG foto reels'],
['CUACA','⛅','local','Cuaca Sukabumi Cianjur'],
['NIK-CHECK','🪪','osint','Parse NIK KTP'],
['DANA-CEK','💳','utility','Tools DANA cek']
];
function render(){
let q=document.getElementById('q').value.toLowerCase();
let g=document.getElementById('grid');g.innerHTML='';
tools.filter(t=>!q||t[0].toLowerCase().includes(q)||t[3].toLowerCase().includes(q)).forEach(t=>{
g.innerHTML+=`<div class="card"><div style="display:flex;justify-content:space-between"><div>${t[1]}</div><div style="font-size:10px;color:#6b7a6b">${t[2]}</div></div><h3 style="margin-top:10px">${t[0]}</h3><p style="font-size:11px;color:#6b7a6b;margin-top:4px">${t[3]}</p></div>`
})
}
function downloadFile(){
let blob=new Blob([document.documentElement.outerHTML],{type:'text/html'});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();
}
render();
</script>
</body>
</html>
